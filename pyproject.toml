[project]
name = "mixlyzer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "librosa>=0.11.0",
    "matplotlib>=3.10.7",
    "pyinstaller>=6.16.0",
    "pyqtgraph>=0.13.7",
    "pyside6>=6.10.0",
    "pyyaml>=6.0.3",
    "soxr>=1.0.0",
    "scikit-image>=0.25.2",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.3",
    "soundfile>=0.13.1",
    "tqdm>=4.67.1",
    "sudachipy>=0.7.0",
    "sudachidict-core>=20261015",
    "anyascii>=0.3.3",
    "rapidfuzz>=3.14.6",
    "pypinyin>=0.55.0",
    "pyrekordbox>=0.5.0",
    "sqlcipher3-wheels>=0.5.7",
]

[dependency-groups]
dev = [
    "babel>=2.18.0",
    "fonttools>=4.60.1",
    "pip-licenses>=5.5.0",
    "pycantonese>=5.0.0",   # build/cantonese.py: its tables written out (assets/readings/cantonese_*.tsv)
]
# build/docs.py: the developer documentation (Sphinx, MyST Markdown; sphinx-intl its translations' catalogs)
docs = [
    "furo>=2025.12.19",
    "myst-parser>=5.1.0",
    "sphinx>=9.1.1",
    "sphinx-autobuild>=2025.8.25",
    "sphinx-copybutton>=0.5.2",
    "sphinx-intl>=2.4.0",
    "sphinxcontrib-mermaid>=2.1.1",
]
# build/audio_engine.py: VOLK's build (cmake, ninja; mako for its generated sources) and the engine's link to it
native = [
    "cmake>=4.4.4",
    "ninja>=1.13.2",
    "mako>=1.4.3",
    "pkgconf>=3.0.7",
]
# training/ (python -m training): the developers' training on the standard ML stack; never the app's (the app runs
# its models in NumPy from their exported weights)
training = [
    "torch>=2.11.0",
]

[tool.uv.sources]
# PyTorch's CUDA 12.8 build where there is one (PyPI's Windows wheel is CPU only); macOS: PyPI's
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
