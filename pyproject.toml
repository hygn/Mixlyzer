[project]
name = "mixlyzer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "librosa>=0.11.0",
    "matplotlib>=3.10.7",
    "pyinstaller>=6.16.0",
    "pyqtgraph>=0.13.7",
    "pyside6>=6.10.0",
    "pyyaml>=6.0.3",
    "soxr>=1.0.0",
    "scikit-image>=0.25.2",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.3",
    "soundfile>=0.13.1",
    "tqdm>=4.67.1",
    "sudachipy>=0.7.0",
    "sudachidict-core>=20261015",
    "anyascii>=0.3.3",
    "rapidfuzz>=3.14.6",
    "pypinyin>=0.55.0",
    "pycantonese>=5.0.0",
]

[dependency-groups]
dev = [
    "babel>=2.18.0",
    "pip-licenses>=5.5.0",
]
# build/audio_engine.py: VOLK's build (cmake, ninja; mako for its generated sources) and the engine's link to it
native = [
    "cmake>=4.4.4",
    "ninja>=1.13.2",
    "mako>=1.4.3",
    "pkgconf>=3.0.7",
]
