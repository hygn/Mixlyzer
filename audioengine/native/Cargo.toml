[package]
name = "mixlyzer-audio"
version = "0.1.0"
edition = "2024"
license-file = "../../LICENSE"
publish = false

[[bin]]
name = "mixlyzer-audio"
path = "src/main.rs"

[dependencies]
cpal = "0.18.2"
realfft = "3.5.0"
volk = "0.2.2"
num-complex = "0.4.6"
crc32fast = "1.5.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Memory", "Win32_System_Performance", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Media"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
panic = "abort"
